- name: Install Docker and Tools
  hosts: jenkins:nexus:sonar
  become: true
  gather_facts: false

  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Install packages
      apt:
        name:
          - git
          - gh
          - tree
          - zsh
          - curl
          - nginx
          - certbot
          - python3-certbot-nginx
          - docker.io
          - docker-compose-v2
          - python3-requests
        update_cache: true
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Install Oh My Zsh
      git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "/home/{{ user }}/.oh-my-zsh"
        version: master
        update: false
      become_user: "{{ user }}"

    - name: Configure Oh My Zsh
      copy:
        dest: "/home/{{ user }}/.zshrc"
        content: |
          export ZSH="$HOME/.oh-my-zsh"
          ZSH_THEME="robbyrussell"
          plugins=(git)
          source "$ZSH/oh-my-zsh.sh"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"
        force: false

    - name: Check Docker status
      command: systemctl is-active docker
      register: docker_status
      changed_when: false
      failed_when: docker_status.stdout != "active"

    - name: Check Nginx status
      command: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: nginx_status.stdout != "active"

    - name: Check Docker Compose
      command: docker compose version
      changed_when: false

    - name: Print server status
      debug:
        msg: "{{ inventory_hostname }} - Docker and Nginx are running"